<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Secret</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Écran de verrouillage -->
<section id="lock" class="lock">
  <div class="lock-glow"></div>
  <svg class="padlock" viewBox="0 0 120 150" aria-hidden="true">
    <path class="shackle" d="M34 70 V44 a26 26 0 0 1 52 0 V70" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <rect class="lbody" x="14" y="64" width="92" height="76" rx="20" fill="#fff"/>
    <circle cx="60" cy="96" r="9" fill="#000"/>
    <rect x="55.5" y="98" width="9" height="20" rx="4.5" fill="#000"/>
  </svg>
  <div class="lock-ui">
    <p class="lock-title" id="lockTitle">Entrez votre code</p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="pad">
      <button class="key glass" data-k="1">1</button><button class="key glass" data-k="2">2</button><button class="key glass" data-k="3">3</button>
      <button class="key glass" data-k="4">4</button><button class="key glass" data-k="5">5</button><button class="key glass" data-k="6">6</button>
      <button class="key glass" data-k="7">7</button><button class="key glass" data-k="8">8</button><button class="key glass" data-k="9">9</button>
      <button class="key ghost" id="bioBtn" aria-label="Empreinte">
        <svg viewBox="0 0 24 24"><path d="M12 3a8 8 0 0 0-8 8v1m16 0v-1a8 8 0 0 0-12-6.9M8 21c-.6-1.5-1-3.2-1-5v-4a5 5 0 0 1 10 0v2m-5 7c-.8-1.8-1-3.5-1-5v-3a1 1 0 0 1 2 0v4c0 1.4.3 2.7.8 4M16.5 21c.3-1 .5-2.1.5-3.2"/></svg>
      </button>
      <button class="key glass" data-k="0">0</button>
      <button class="key ghost" id="delBtn" aria-label="Effacer">
        <svg viewBox="0 0 24 24"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="M12.5 9.5l5 5m0-5l-5 5"/></svg>
      </button>
    </div>
    <button class="lock-cancel hidden" id="cancelPin">Annuler</button>
  </div>
</section>

<!-- Application -->
<main id="app" class="app hidden">
  <section class="screen" id="home">
    <header class="home-head">
      <h1>Secret</h1>
      <div class="head-actions">
        <button class="icon-btn glass" id="lockNow" aria-label="Verrouiller">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </button>
        <button class="icon-btn glass" id="settingsBtn" aria-label="Réglages">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
      </div>
    </header>
    <div class="cats" id="cats"></div>
  </section>
</main>

<div id="viewer" class="viewer hidden"></div>
<div id="layer"></div>
<div id="toast" class="toast glass"></div>

<script src="capacitor.js"></script>
<script src="app.js"></script>
</body>
</html>
