name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install & sync Capacitor
        run: |
          npm ci
          npm run sync

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.SECRET_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret SECRET_KEYSTORE_BASE64 manquant : APK non signé avec la clé permanente."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/secret.jks"
          echo "SECRET_KEYSTORE_PATH=$RUNNER_TEMP/secret.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.SECRET_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.SECRET_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.SECRET_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VN=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          VC=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Secret-v${VN}-${VC}.apk"
          echo "APK_NAME=Secret-v${VN}-${VC}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/secret.jks"
